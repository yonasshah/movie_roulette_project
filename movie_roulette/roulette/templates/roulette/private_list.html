{% extends 'roulette/base.html' %}

{% block title %}Private List{% endblock %}

{% block content %}
<div class="bg-gray-800 p-8 rounded-lg shadow-2xl max-w-2xl mx-auto text-center">
    <h2 class="text-3xl font-extrabold text-white mb-4">
        <i class="fas fa-lock mr-3 text-yellow-400"></i>Private List
    </h2>
    <p class="text-gray-300 mb-6">
        This list belongs to <a href="{% url 'roulette:user_profile' username=list_owner.username %}" class="font-semibold text-indigo-400 hover:underline">@{{ list_owner.username }}</a> and is currently private.
    </p>
    <a href="{% url 'roulette:discover' %}" class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg text-sm">
        Back to Discover
    </a>
</div>
{% endblock %}
