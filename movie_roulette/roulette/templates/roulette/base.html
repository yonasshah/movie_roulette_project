<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Movie Roulette{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        html { overflow-y: scroll; }
        body { font-family: 'Poppins', sans-serif; background-color: #111827; color: #f3f4f6; }
        .list-item { transition: background-color O.2s; }
        {% block style %}{% endblock %}
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8">

    <nav class="fixed top-0 left-0 right-0 z-50 bg-gray-900 border-b border-indigo-700 shadow-lg py-4 px-8">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            
            <div class="flex items-center space-x-8">
                <a href="{% url 'roulette:roulette_view' %}" class="text-2xl font-bold text-white hover:text-indigo-400 transition-colors">
                    🎲 Roulette
                </a>
                
                <div class="hidden md:flex items-center space-x-6 text-sm font-semibold">
                    <a href="{% url 'roulette:discover' %}" class="text-gray-300 hover:text-white transition-colors">Discover</a>
                    
                    <form action="{% url 'roulette:search_results' %}" method="GET" class="relative">
                        <input type="text" name="q" placeholder="Search movies, shows, users..." class="bg-gray-800 border border-gray-700 rounded-full py-1 pl-4 pr-10 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 w-64">
                        <button type="submit" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500">
                            <i class="fas fa-search"></i>
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="flex items-center space-x-6 text-sm font-semibold">
                
                {% if user.is_authenticated %}
                    
                    <a href="{% url 'users:settings' %}" class="text-gray-300 hover:text-white transition-colors flex items-center">
                        <i class="fas fa-cog mr-2"></i>Settings
                    </a>

                    <a href="{% url 'roulette:user_profile' username=user.username %}" class="text-gray-300 hover:text-white transition-colors flex items-center">
                        <i class="fas fa-user mr-2"></i>My Profile
                    </a>
                    
                    <form action="{% url 'users:logout' %}" method="post" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="text-indigo-400 hover:text-white transition-colors bg-transparent border-none cursor-pointer">
                            <i class="fas fa-sign-out-alt mr-1"></i>Logout
                        </button>
                    </form>
                    
                {% else %}
                    <a href="{% url 'users:login' %}" class="text-gray-300 hover:text-white transition-colors">Log In</a>
                    <a href="{% url 'users:signup' %}" class="bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition-colors">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="w-full max-w-4xl pt-20">
        {% block content %}
        {% endblock %}
    </main>
    
    {% block scripts %}
    {% endblock %}
</body>
</html>
