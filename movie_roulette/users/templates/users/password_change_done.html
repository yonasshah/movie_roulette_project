{% extends 'roulette/base.html' %}

{% block title %}Password Changed{% endblock %}

{% block content %}
<div class="bg-gray-800 p-8 rounded-lg shadow-2xl max-w-md mx-auto text-center">
    <h2 class="text-3xl font-extrabold text-white mb-4">
        Password Changed Successfully
    </h2>
    <p class="text-gray-300 mb-6">Your password has been updated.</p>
    <a href="{% url 'users:account_settings' %}" class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg text-sm">
        Back to Account Settings
    </a>
</div>
{% endblock %}
